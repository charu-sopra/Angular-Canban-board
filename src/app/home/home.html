                    height="16"

        <!-- CALENDAR -->
         <mat-list-item
                routerLink="/home/calendar"

            >

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"

        <div class="sidebar-user">
